# SwiftLint Configuration for BobCam iOS Project
# For more information: https://github.com/realm/SwiftLint

# Included and excluded paths
included:
  - .
excluded:
  - Pods
  - vendor
  - fastlane
  - .build
  - DerivedData
  - Build

# Rules to run
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo
  - line_length # Will be configured below
  - type_body_length # Will be configured below

# Rule configurations
line_length:
  warning: 120
  error: 150
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 500
  error: 800

type_name:
  min_length: 3
  max_length: 40

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - id
    - URL
    - x
    - y
    - z

# Custom rules
custom_rules:
  # Encourage documentation for public APIs
  public_docs:
    name: "Public Documentation"
    regex: '^public (?!.*\/\/)'
    message: "Public declarations should be documented"
    severity: warning

  # Discourage force unwrapping in production code
  force_unwrap_warning:
    name: "Force Unwrap Warning"
    regex: '!\s*(?!\/\/)'
    message: "Consider using optional binding instead of force unwrapping"
    severity: warning

# File header template (optional)
file_header:
  required_pattern: |
                    \/\/
                    \/\/  .*\.swift
                    \/\/  BobCam
                    \/\/
                    \/\/  Created by .* on \d{1,2}\/\d{1,2}\/\d{2,4}\.
                    \/\/

# Analyzer rules (for SwiftLint 0.50+)
analyzer_rules:
  - explicit_self
  - unused_import
  - unused_declaration